[project]
name = "ai-engineering-journey"
version = "0.1.0"
description = "My AI engineering learning journey"
requires-python = ">=3.14"
dependencies = [
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineering"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
